site_name: pyvcell
repo_url: https://github.com/vivarium-collective/biosimulator-processes
site_url: https://github.com/vivarium-collective/biosimulator-processes
site_description: Core implementations of simulator processes using the process-bigraph Process API.
site_author: Alexander Patrie
edit_uri: edit/main/docs/
repo_name: vivarium-collective/biosimulator-processes
copyright: Maintained by <a href="https://vivariumlab.com/">Vivarium Lab</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append('../')
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vivarium-collective/biosimulator-processes
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/biosimulator-processes/

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true