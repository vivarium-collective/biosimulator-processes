root = "."
testdata_dir = ".test"
tmp_dir = ".air"

[build]
  args_bin = ["--mode=local"]
  bin = ".air/main"
  cmd = "go build -o .air/main ."
  delay = 1000
  exclude_dir = ["assets", ".test", "vendor", ".air"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  pre_cmd = ["go work sync", "go mod tidy"]
  post_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  main = "blue"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
