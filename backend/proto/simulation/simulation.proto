syntax = "proto3";

import "google/protobuf/struct.proto";

package sim;

option go_package = "github.com/vivarium-collective/biosimulator-processes/backend/proto/sim;sim";

service Simulator {
  rpc SubmitSimulation(SimulationRequest) returns (stream SimulationResponse);
  rpc WorkerStream(stream WorkerMessage) returns (stream WorkerMessage);
}

message SimulationRequest {
  string job_id = 1;
  string timestamp = 2;
  int32 duration = 3;
  string document = 4;
}

message SimulationResponse {
  string job_id = 1;
  string timestamp = 2;
  string status = 3;
  string results = 4;
  int32 interval_id = 5;
}

message WorkerMessage {
  oneof payload {
    WorkerHello hello = 1;
    SimulationRequest job = 2;
    SimulationResponse result = 3;
    WorkerAck ack = 4;
  }
}

message WorkerHello {
  string worker_id = 1;
}

message WorkerAck {
  string job_id = 1;
  string status = 2;
}
